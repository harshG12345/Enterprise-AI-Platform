name: DevSecOps Security Audit & Vulnerability Scanner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC

jobs:
  codeql-analysis:
    name: CodeQL Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript-typescript']
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL Analysis Engine
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Audit Backend Dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || echo "Audit completed with warnings"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Audit Frontend Dependencies (npm audit)
        run: |
          cd frontend
          npm audit --audit-level=high || echo "Frontend audit completed with warnings"

  container-vulnerability-scan:
    name: Trivy Container Image Security Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Build Local Backend Container Image
        run: |
          docker build -t enterprise-ai-backend:scan ./backend

      - name: Run Trivy Security Vulnerability Scan on Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'enterprise-ai-backend:scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
