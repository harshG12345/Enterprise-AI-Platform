version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprise_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_ai_network

  redis:
    image: redis:7-alpine
    container_name: enterprise_ai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_ai_network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.0
    container_name: enterprise_ai_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_data:/mlflow
    networks:
      - enterprise_ai_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise_ai_backend
    restart: unless-stopped
    command: ["api"]
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/enterprise_ai
      - DATABASE_URL_SYNC=postgresql+psycopg2://postgres:postgres@postgres:5432/enterprise_ai
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - POSTGRES_HOST=postgres
      - SECRET_KEY=${SECRET_KEY:-enterprise-ai-platform-production-jwt-signing-secret-key-32chars}
      - ENVIRONMENT=production
      - WEB_CONCURRENCY=4
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - enterprise_ai_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise_ai_celery_worker
    restart: unless-stopped
    command: ["worker"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/enterprise_ai
      - DATABASE_URL_SYNC=postgresql+psycopg2://postgres:postgres@postgres:5432/enterprise_ai
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - POSTGRES_HOST=postgres
      - SECRET_KEY=${SECRET_KEY:-enterprise-ai-platform-production-jwt-signing-secret-key-32chars}
      - ENVIRONMENT=production
      - CELERY_CONCURRENCY=4
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
    networks:
      - enterprise_ai_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprise_ai_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - enterprise_ai_network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: enterprise_ai_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - enterprise_ai_network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: enterprise_ai_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - enterprise_ai_network

  nginx:
    image: nginx:1.25-alpine
    container_name: enterprise_ai_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - mlflow
      - prometheus
      - grafana
    networks:
      - enterprise_ai_network

networks:
  enterprise_ai_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mlflow_data:
  backend_data:
  prometheus_data:
  grafana_data:
